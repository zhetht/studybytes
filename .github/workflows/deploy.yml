name: Deploy Flutter Web → Vercel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Flutter 3.22.3 — última estable de la rama 3.22
      # Cambia a '3.24.5' si quieres la más reciente (requiere Dart 3.5+)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: studybytes
        run: flutter pub get

      - name: Flutter clean
        working-directory: studybytes
        run: flutter clean

      - name: Build Web
        working-directory: studybytes
        run: flutter build web --release --base-href /

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./studybytes/build/web
          vercel-args: '--prod'
