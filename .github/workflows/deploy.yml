name: Deploy Flutter Web → Vercel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Generate api_config.dart from secrets
        working-directory: studybytes
        run: |
          mkdir -p lib/config
          cat > lib/config/api_config.dart << EOF
          // Auto-generado por GitHub Actions — NO editar manualmente
          class ApiConfig {
            static const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
            static const String supabaseUrl = '${{ secrets.SUPABASE_URL }}';
            static const String supabaseAnonKey = '${{ secrets.SUPABASE_ANON_KEY }}';
          }
          EOF

      - name: Install dependencies
        working-directory: studybytes
        run: flutter pub get

      - name: Build Web
        working-directory: studybytes
        run: flutter build web --release --base-href /

      - name: Deploy to Vercel
        run: |
          npm install -g vercel@latest
          cd studybytes
          vercel build/web --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}